services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////data/sweepstakes.db
      PUBLIC_BASE_URL: https://sweepstakes.corrigan.events
      CORS_ORIGINS: https://sweepstakes.corrigan.events,https://ss.corrigan.events
      APP_ENV: production
      WC2026_API_URL: ${WC2026_API_URL:-https://api.football-data.org/v4}
      WC2026_COMPETITION_CODE: ${WC2026_COMPETITION_CODE:-WC}
      WC2026_SEASON: ${WC2026_SEASON:-2026}
      WC2026_RATE_LIMIT_PER_MINUTE: ${WC2026_RATE_LIMIT_PER_MINUTE:-9}
      PORTAL_TOKEN: ${PORTAL_TOKEN:-}
    init: true
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - sweepstakes_data:/data

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////data/sweepstakes.db
      PUBLIC_BASE_URL: https://sweepstakes.corrigan.events
      APP_ENV: production
      WC2026_API_URL: ${WC2026_API_URL:-https://api.football-data.org/v4}
      WC2026_COMPETITION_CODE: ${WC2026_COMPETITION_CODE:-WC}
      WC2026_SEASON: ${WC2026_SEASON:-2026}
      WC2026_RATE_LIMIT_PER_MINUTE: ${WC2026_RATE_LIMIT_PER_MINUTE:-9}
    init: true
    mem_limit: 160m
    mem_reservation: 80m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - sweepstakes_data:/data
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    init: true
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  sweepstakes_data:
