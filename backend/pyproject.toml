[project]
name = "sweepstakes-api"
version = "0.1.0"
description = "FastAPI backend for corrigan.events sweepstakes"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.34",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
